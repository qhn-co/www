# Page d'accueil de qhn.fr : fichiers statiques, plus /api/suggestion
# transmis au service d'envoi local (envoi/suggestion.py).
# Au plus une suggestion toutes les 10 s par adresse, en rafale de 3.
limit_req_zone $binary_remote_addr zone=suggestion:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière le Traefik de Coolify, $remote_addr serait celle du proxy pour
    # tout le monde : on prend l'adresse du visiteur dans X-Forwarded-For,
    # en ne faisant confiance qu'aux réseaux privés (réseaux Docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # www.qhn.fr a longtemps servi Aveliou (anciennement explorer) sous /explorer/.
    # Si ce domaine passe un jour sur cette page, les anciens liens suivent.
    location /explorer {
        return 301 https://aveliou.qhn.fr$request_uri;
    }

    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Formulaire « Une idée de petit projet ? » : service Python local (envoi/).
    location = /api/suggestion {
        limit_req zone=suggestion burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
