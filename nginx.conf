# Page d'accueil de qhn.fr. Fichiers statiques seulement.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # www.qhn.fr a longtemps servi Aveliou (anciennement explorer) sous /explorer/.
    # Si ce domaine passe un jour sur cette page, les anciens liens suivent.
    location /explorer {
        return 301 https://aveliou.qhn.fr$request_uri;
    }

    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
